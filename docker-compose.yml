version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lifeline_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: lifeline_emergency
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: lifeline_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/lifeline_emergency
      - SECRET_KEY=production-jwt-secret-key-lifeline-2026
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: lifeline_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
